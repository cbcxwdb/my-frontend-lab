<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>异步实验</title>
  <link rel="icon" href="data:,">
</head>

<body>
  <h2>异步实验</h2>
  <p id="status">加载中...</p>
  <ul id="box"></ul>
  <button id="reload">刷新</button>

  <script>
    const box = document.querySelector('#box');
    const status = document.querySelector('#status');
    const reload = document.querySelector('#reload');

    function renderList(container, items) {
      container.replaceChildren();

      for (let i = 0; i < items.length; i++) {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = items[i].html_url;
        a.textContent = items[i].name;

        li.appendChild(a);
        container.appendChild(li);
      }
    }

    async function loadData() {
      status.textContent = '加载中...';
      box.replaceChildren();
      try {
        const res = await fetch('https://api.github.com/users/cbcxwdb/repos');
        const data = await res.json();

        renderList(box, data);
        status.textContent = '共' + data.length + '仓库';
      } catch (err) {
        status.textContent = '加载失败，请刷新重试';
        console.log('出错了:', err);
      }
    }

    reload.addEventListener('click', loadData);
    loadData();
  </script>
</body>

</html>
