<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="card">

    <div class="avatar" title="我的头像">🧑‍💻</div>

    <h1 class="name">lhh</h1>

    <p class="intro">计算机科学与技术的专升本在读学生
      正在从新学习前端开发，并与ai结合使用，
      路线是HTML/CSS/JS->React->node.js
      目标是，在明年实训前能成为一名能独立交付ai工具的前端实习生。
    </p>
    <div class="skills">
      <h2>我的技能树</h2>
      <ul class="skills-list">
      </ul>
    </div>

    <button class="btn">点我看看</button>
  </div>
  <script>
    (function () {
      var colors = [
        '#1a1a2e', // 深海蓝
        '#16213e', // 午夜蓝
        '#0f3460', // 宝石蓝
        '#2d3436', // 深炭灰
        '#1e272e', // 暗石板色
        '#2c3e50', // 灰蓝色
        '#1b1b2f', // 暗紫蓝
        '#000000'  // 纯黑
      ];
      var index = 0;

      document.querySelector('.btn').addEventListener('click', function () {
        alert('欢迎来到我的个人主页！');
        document.body.style.background = colors[index];
        index = (index + 1) % colors.length;
      });
    })();

    const mySkills = ["HTML", "CSS", "JavaScript", "AI 工具应用", "React"];

    function renderSkills(list) {
      const ul = document.querySelector('.skills-list');
      if (!ul) return;
      ul.replaceChildren();

      const frag = document.createDocumentFragment();

      list.forEach(function (skill) {
        const li = document.createElement('li');
        li.textContent = skill;
        frag.appendChild(li);
      });
      ul.appendChild(frag);
    }
    renderSkills(mySkills);

    mySkills.push("React");
    renderSkills(mySkills);

  </script>
</body>

</html>
