<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    .box {
      width: 200px;
      padding: 20px;
      border: 5px solid red;
      background: #eee;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <div class="box">neiron</div>
</body>

</html>
